<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Decision Formfill</title>
  <link rel="stylesheet" href="../../src/app/style.css" />
</head>
<body class="popup">
  <header><strong>Decision Formfill</strong><span class="small">Firefox</span></header>
  <p class="subhead">使用 Decision API 理解並填寫網頁表單</p>
  <div id="message" role="status" class="status"></div>
  <section id="uninitialized" hidden>
    <p>尚未建立加密 Profile。</p>
    <button id="setup" type="button">開始設定</button>
  </section>
  <section id="locked" hidden>
    <label>解鎖密碼 <input id="unlock-password" type="password" autocomplete="off" /></label>
    <button id="unlock" type="button">解鎖 Profile</button>
  </section>
  <section id="ready" hidden>
    <label>目前 Profile <select id="profiles"></select></label>
    <label class="inline"><input id="overwrite" type="checkbox" />覆蓋已填欄位</label>
    <button id="fill" type="button" class="primary">智慧填寫目前頁面</button>
    <div class="button-row"><button id="open-options" type="button">管理 Profile / API</button><button id="lock" type="button">鎖定</button></div>
  </section>
  <script type="module" src="./main.ts"></script>
</body>
</html>
