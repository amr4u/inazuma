name: Sign published Firefox release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag, exactly matching the package version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: firefox-unlisted-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # Trusted automation stays separate from the immutable release sources.
      # This also permits safe retries of tags predating these helper commands.
      - name: Check out trusted release automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: automation
          fetch-depth: 0
          persist-credentials: false
      - name: Validate published release and skip verified complete assets
        id: preflight
        working-directory: automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/firefox-release.py preflight --state "$GITHUB_WORKSPACE/release-state.json" --downloads "$RUNNER_TEMP/existing-release"
      - name: Check out exact release tag commit
        if: steps.preflight.outputs.needs_signing == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.preflight.outputs.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact source checkout and manifest identity
        if: steps.preflight.outputs.needs_signing == 'true'
        working-directory: source
        env:
          TARGET_COMMIT: ${{ steps.preflight.outputs.commit }}
          RELEASE_TAG: ${{ steps.preflight.outputs.tag }}
        run: python3 ../automation/scripts/firefox-release.py context --commit "$TARGET_COMMIT" --tag "$RELEASE_TAG"
      - name: Set up Node.js
        if: steps.preflight.outputs.needs_signing == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked build and signing tools
        if: steps.preflight.outputs.needs_signing == 'true'
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test and build Firefox MV2 package
        if: steps.preflight.outputs.needs_signing == 'true'
        working-directory: source
        run: npm test
      - name: Lint self-hosted Firefox package
        if: steps.preflight.outputs.needs_signing == 'true'
        working-directory: source
        run: npx --no-install web-ext lint --self-hosted --source-dir dist-firefox-offline --warnings-as-errors
      - name: Prepare reviewable source and unpacked archives
        if: steps.preflight.outputs.needs_signing == 'true'
        working-directory: source
        run: python3 ../automation/scripts/firefox-release.py prepare
      - name: Sign unlisted with Mozilla
        if: steps.preflight.outputs.needs_signing == 'true'
        working-directory: source
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_AMO_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WEB_EXT_API_KEY:-}" || -z "${WEB_EXT_API_SECRET:-}" ]]; then
            echo 'Missing FIREFOX_AMO_API_KEY or FIREFOX_AMO_API_SECRET repository secret.' >&2
            exit 1
          fi
          VERSION="$(node -p 'require("./package.json").version')"
          cp -R dist-firefox-offline signing-input
          npx --no-install web-ext sign --channel unlisted --no-config-discovery --no-input \
            --approval-timeout 900000 \
            --source-dir signing-input --artifacts-dir signed-artifacts \
            --upload-source-code "release/inazuma-v$VERSION-source.zip" \
            --amo-metadata .github/amo-metadata.json
      - name: Verify signed payload, identity and checksums
        if: steps.preflight.outputs.needs_signing == 'true'
        working-directory: source
        run: python3 ../automation/scripts/firefox-release.py verify --signed-dir signed-artifacts
      - name: Preserve verified artifacts
        if: steps.preflight.outputs.needs_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: inazuma-signed-release
          path: source/release/*
          if-no-files-found: error
      - name: Upload verified assets to the same published release without overwrite
        if: steps.preflight.outputs.needs_signing == 'true'
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ../automation/scripts/firefox-release.py upload --state "$GITHUB_WORKSPACE/release-state.json" --downloads "$RUNNER_TEMP/uploaded-release"
