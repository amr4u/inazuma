name: Publish Firefox test release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Test and build Firefox MV2 package
        run: npm test
      - name: Package unsigned development build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cd dist-firefox-offline
          zip -q -r ../release/inazuma-v0.1.0-alpha.1-unsigned.xpi .
          zip -q -r ../release/inazuma-v0.1.0-alpha.1-unpacked.zip .
          cd ..
          unzip -p release/inazuma-v0.1.0-alpha.1-unsigned.xpi manifest.json >/dev/null
          (cd release && sha256sum *.xpi *.zip > SHA256SUMS.txt)
      - name: Create or update GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.0-alpha.1"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" \
              --title "v0.1.0-alpha.1 — Firefox development preview" \
              --notes-file .github/RELEASE_NOTES.md \
              --prerelease --latest=false
          fi
