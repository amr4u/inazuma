<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>登録フォームのテスト</title>
<style>body{font:16px system-ui;max-width:540px;margin:30px auto;padding:12px} label{display:block;margin:12px 0} input,select{display:block;font:inherit;padding:5px;width:100%}.row{display:flex;gap:10px}.row label{flex:1}</style>
</head><body>
<h1>会員登録（テスト）</h1><p>これは送信しないローカルテストフォームです。</p>
<form id="signup">
<fieldset><legend>氏名</legend><div class="row"><label>姓<input name="last_name" autocomplete="family-name"></label><label>名<input name="first_name" autocomplete="given-name"></label></div></fieldset>
<fieldset><legend>フリガナ</legend><div class="row"><label>セイ<input name="last_name_kana"></label><label>メイ<input name="first_name_kana"></label></div></fieldset>
<label>メールアドレス<input type="email" name="email" autocomplete="email"></label>
<label>郵便番号<input name="postal" autocomplete="postal-code"></label>
<label>都道府県<select name="prefecture"><option value="">選択してください</option><option value="東京都">東京都</option><option value="神奈川県">神奈川県</option><option value="大阪府">大阪府</option></select></label>
<label>住所<input name="street" autocomplete="street-address"></label>
<label>パスワード<input type="password" name="new_password" autocomplete="new-password"></label>
<label>パスワード（確認用）<input type="password" name="confirm_password" autocomplete="new-password"></label>
<label><input type="checkbox" name="newsletter">メールマガジンを希望する</label>
<button type="submit">確認（送信しません）</button>
</form>
<pre id="result"></pre>
<script>document.getElementById('signup').addEventListener('submit',e=>{e.preventDefault();document.getElementById('result').textContent='テストフォーム：送信しません。';});</script>
</body></html>
